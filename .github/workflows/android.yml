name: Android CI

on:
  push:
    branches:
      - master
      - "modernize/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Verify Compose application, tests and benchmark APK
        run: >-
          ./gradlew --no-daemon
          :app:lintDebug
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleDebugAndroidTest
          :benchmark:assembleBenchmarkBenchmark

  instrumentation:
    name: API 35 managed-device tests
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Enable KVM access
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Run instrumented tests
        run: ./gradlew --no-daemon --info :app:pixel2Api35DebugAndroidTest

      - name: Upload managed-device reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: managed-device-test-results-${{ github.run_id }}
          path: |
            modern-app/build/reports/androidTests/managedDevice/
            modern-app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: warn
          retention-days: 7

  performance:
    name: Profiles, process recovery and 10k performance
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    needs: instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Enable KVM access
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Generate Baseline and Startup Profiles
        run: ./gradlew --no-daemon --info :app:generateBaselineProfile

      - name: Run process recovery and macrobenchmark smoke suite
        run: >-
          ./gradlew --no-daemon --info
          :benchmark:pixel2Api35BenchmarkBenchmarkAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=top.geek_studio.chenlongcould.musicplayer.benchmark.PlaybackProcessRecoveryTest,top.geek_studio.chenlongcould.musicplayer.benchmark.StartupBenchmark,top.geek_studio.chenlongcould.musicplayer.benchmark.SettingsScrollBenchmark,top.geek_studio.chenlongcould.musicplayer.benchmark.LargeLibraryScrollBenchmark

      - name: Upload profiles and benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-results-${{ github.run_id }}
          path: |
            modern-app/src/main/generated/baselineProfiles/
            benchmark/build/outputs/managed_device_android_test_additional_output/
            benchmark/build/outputs/androidTest-results/managedDevice/
            benchmark/build/reports/androidTests/managedDevice/
          if-no-files-found: warn
          retention-days: 14
